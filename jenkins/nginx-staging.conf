# ==============================================================================
# Configuración de Nginx para el Entorno Staging (CD de Jenkins)
# Sirve el frontend estático desplegado por Jenkins en /cd-deploy/web y enruta
# las peticiones /api/ y /healthz al binario de Go en staging-api:8080.
# ==============================================================================
server {
    listen 80;
    server_name localhost;

    root /cd-deploy/web;
    index index.html;

    # Servir archivos estáticos de la SPA de React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso hacia el backend en Go desplegado por Jenkins
    location /api/ {
        proxy_pass http://staging-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy inverso para la verificación de salud (/healthz)
    location = /healthz {
        proxy_pass http://staging-api:8080/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
